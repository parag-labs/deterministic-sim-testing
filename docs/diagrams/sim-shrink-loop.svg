<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="940" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">deterministic-sim-testing - simulate &amp; shrink loop</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A run is a pure function of one 64-bit seed: search seeds until an invariant breaks, then shrink the fault schedule to what actually matters.</text><rect x="50" y="150" width="1460" height="246" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">SEARCH FOR A FAILING SEED</text><rect x="80" y="200" width="250" height="88" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(96,215) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17 12v4"/><path d="M20 12v3"/></g><text x="126" y="231" font-size="16.5" font-weight="700" fill="#3d4a63">64-bit seed</text><text x="97" y="253.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">random_faults(Rng(seed))</text><rect x="80" y="296" width="250" height="88" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(96,311) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="126" y="327" font-size="16.5" font-weight="700" fill="#3d4a63">Workload model</text><text x="97" y="349.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Nodes: send / timer calls</text><rect x="430" y="220" width="300" height="140" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(446,235) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="476" y="251" font-size="16.5" font-weight="700" fill="#552fae">Simulator</text><text x="447" y="273.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">single thread - virtual time</text><text x="447" y="290.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one splitmix64 PRNG</text><text x="447" y="308.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">heap ties break on (time, seq)</text><rect x="800" y="220" width="250" height="140" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(816,235) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/></g><text x="846" y="251" font-size="16.5" font-weight="700" fill="#17509f">Event trace</text><text x="817" y="273.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">(now, event, fields)</text><text x="817" y="290.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">identical for a given seed</text><rect x="1130" y="220" width="300" height="140" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1146,235) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1176" y="251" font-size="16.5" font-weight="700" fill="#8c5a0d">Invariant?</text><text x="1147" y="273.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">do the replicas agree?</text><text x="1147" y="290.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">holds -&gt; try the next seed</text><text x="1147" y="308.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">breaks -&gt; shrink this case</text><path d="M330,250 L430,276" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M330,340 L430,314" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M730,290 L800,290" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="738.512" y="278.0" width="52.976" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="765.0" y="294.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">trace</text><path d="M1050,290 L1130,290" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M1280,220 L1280.0,193.0 Q1280,178 1265.0,178.0 L216.0,178.0 Q205,178 205.0,189.0 L205,200" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="702.624" y="166.0" width="78.752" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="742" y="182.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">next seed</text><path d="M1280,360 L1280.0,405.0 Q1280,420 1265.0,420.0 L55.0,420.0 Q40,420 40.0,435.0 L40.0,560.0 Q40,575 55.0,575.0 L70,575" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="618.72" y="408.0" width="162.56" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="700" y="424.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">failing (seed, schedule)</text><rect x="50" y="452" width="1460" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e05561" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="443" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#9e2b36">SHRINK THE SCHEDULE - DDMIN</text><rect x="70" y="515" width="240" height="120" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,530) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="116" y="546" font-size="16.5" font-weight="700" fill="#9e2b36">Failing schedule</text><text x="87" y="568.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">still_fails() true to start</text><text x="87" y="585.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">n starts at 2</text><rect x="360" y="515" width="240" height="120" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(376,530) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="406" y="546" font-size="16.5" font-weight="700" fill="#17509f">Split into n chunks</text><text x="377" y="568.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">_split(cur, n)</text><text x="377" y="585.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">near-even partitions</text><rect x="710" y="515" width="280" height="120" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(726,530) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="756" y="546" font-size="16.5" font-weight="700" fill="#552fae">Drop a chunk, replay</text><text x="727" y="568.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">test each complement</text><text x="727" y="585.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">at the SAME seed</text><rect x="1150" y="515" width="290" height="120" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1166,530) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="1196" y="546" font-size="16.5" font-weight="700" fill="#186547">Minimal reproducer</text><text x="1167" y="568.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the 1-2 faults that</text><text x="1167" y="585.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">actually matter</text><circle cx="90" cy="498" r="13" fill="#ffffff" stroke="#e05561" stroke-width="1.8"/><text x="90" y="502.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e05561">1</text><circle cx="380" cy="498" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="380" y="502.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">2</text><circle cx="730" cy="498" r="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="730" y="502.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b5cf6">3</text><path d="M310,575 L360,575" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="314.2" y="563.0" width="41.599999999999994" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="335.0" y="579.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">n=2</text><path d="M600,575 L710,575" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="608.424" y="563.0" width="93.152" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="655.0" y="579.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">complements</text><path d="M990,575 L1150,575" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="997.072" y="563.0" width="145.856" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1070.0" y="579.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">can't shrink -&gt; done</text><path d="M850,635 L850.0,685.0 Q850,700 835.0,700.0 L495.0,700.0 Q480,700 480.0,685.0 L480,635" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="549.952" y="688.0" width="230.09599999999998" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="665" y="704.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">smaller still fails: keep it, adjust n</text><rect x="50" y="774" width="470" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="798" font-size="13.2" font-weight="700" fill="#3d4a63">A run is a pure function of one seed</text><text x="66" y="820" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Same seed + workload + schedule -&gt; byte-identical trace.</text><text x="66" y="838.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Simultaneous events fire in insertion order: (time, seq).</text><text x="66" y="856.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">No OS threads, no wall-clock reads in the core.</text><rect x="545" y="774" width="470" height="95.19999999999999" rx="11" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.4" stroke-opacity="0.8"/><text x="561" y="798" font-size="13.2" font-weight="700" fill="#136b74">The seeded stream stays aligned</text><text x="561" y="820" font-size="12.4" fill="#136b74" fill-opacity="0.92">A loss draw is taken only when drop_prob &gt; 0, so enabling</text><text x="561" y="838.4" font-size="12.4" fill="#136b74" fill-opacity="0.92">loss never shifts the latency stream. chance(p&lt;=0 / p&gt;=1)</text><text x="561" y="856.8" font-size="12.4" fill="#136b74" fill-opacity="0.92">takes no draw. Faults are re-checked again on delivery.</text><rect x="1040" y="774" width="470" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="1056" y="798" font-size="13.2" font-weight="700" fill="#8c5a0d">How ddmin narrows the schedule</text><text x="1056" y="820" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">n = 2; a winning complement -&gt; n = max(n-1, 2);</text><text x="1056" y="838.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">a stall -&gt; n = min(len, 2n); stop when n &gt;= len.</text><text x="1056" y="856.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Replay is ~free (+3.35% measured), so re-testing is cheap.</text><text x="780.0" y="922" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/deterministic-sim-testing</text></svg>