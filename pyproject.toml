[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-sim-testing"
version = "0.1.0"
description = "Deterministic simulation testing for distributed code - replay any run from one 64-bit seed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parag Sawant" }]
keywords = ["deterministic-simulation", "distributed-systems", "testing", "dst", "fault-injection"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["seedsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
